server:
  port: ${PORT:8090}

spring:
  application:
    name: gestor-fe-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://gestor-fe.assolidaria.org.co"
              - "http://gestor-fe.assolidaria.org.co"
              - "http://localhost:4200"
              - "http://10.3.26.4:4200"
              - "http://10.3.26.4"
              - "http://10.3.26.4:80"
              - "http://127.0.0.1:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: gestor-fe-admin-service-route
          uri: lb://gestor-fe-admin-service
          predicates:
            - Path=/api/admin/**, /gestor-fe-admin-service/**
          filters:
            - StripPrefix=1

        - id: gestor-fe-core-service-route
          uri: lb://gestor-fe-core-service
          predicates:
            - Path=/api/core/**, /gestor-fe-core-service/**
          filters:
            - StripPrefix=1
