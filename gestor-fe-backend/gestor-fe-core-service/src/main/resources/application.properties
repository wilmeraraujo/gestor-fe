spring.application.name=gestor-fe-core-service
server.port=9096

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://10.3.26.2:5432/gestor_fe_core_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:MTL2026*-}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true
logging.level.org.hibernate.SQL=debug


spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=update

# Los JOBs de Spring Batch no se ejecutan al arrancar Sprint
spring.batch.job.enabled=false
spring.main.allow-bean-definition-overriding=true
# Inicializar el schema para Spring Batch. Esto es, crea las tablas que se requieren
spring.batch.jdbc.initialize-schema=always



setCorePoolSize=10
setMaxPoolSize=20
ruta.storage=${RUTA_STORAGE:/opt/storage/gestion-fe/}
ruta.storage.validos=${RUTA_STORAGE_VALIDOS:/opt/storage/gestion-fe-validos/}
# Windows local dev fallback
#ruta.storage=E:\\gestion-fe\\
#ruta.storage.validos=E:\\gestion-fe-validos\\

# Silenciar el StackTrace ruidoso de Spring Batch al fallar validaciones de negocio
logging.level.org.springframework.batch.core.step.AbstractStep=OFF
logging.level.org.springframework.batch.core.step.item.FaultTolerantChunkProcessor=OFF

admin-service.url=${ADMIN_SERVICE_URL:http://10.3.26.3:9095}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Spring Cloud Config Server & Eureka Service Discovery
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://10.3.26.3:8888/}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://10.3.26.3:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always