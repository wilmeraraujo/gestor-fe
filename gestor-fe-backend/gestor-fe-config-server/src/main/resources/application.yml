server:
  port: 8888

spring:
  application:
    name: gestor-fe-config-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}
  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_SEARCH_LOCATIONS:file:/config-repo}
        git:
          uri: ${GIT_URI:https://github.com/wilmeraraujo/gestor-fe.git}
          username: ${GIT_USERNAME:jeferD}
          password: ${GIT_PASSWORD:}
          default-label: ${GIT_LABEL:development}
          search-paths: ${GIT_SEARCH_PATHS:config-repo}
          clone-on-start: true
          force-pull: true
          timeout: 15
          skip-ssl-validation: true

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://10.3.26.3:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
