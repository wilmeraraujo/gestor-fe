spring.application.name=gestor-fe-admin-service
server.port=9095

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://10.3.26.2:5432/gestor_fe_core_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:MTL2026*-}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true
logging.level.org.hibernate.SQL=debug

spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.hibernate.ddl-auto=update

# Spring Cloud Config Server & Eureka Service Discovery
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://10.3.26.3:8888/}
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://10.3.26.3:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


