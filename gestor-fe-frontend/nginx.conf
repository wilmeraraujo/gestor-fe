# =========================================================================
# CONFIGURACIÓN NGINX PARA GESTOR FE Y KEYCLOAK EN VM3 (10.3.26.4)
# =========================================================================

# 1. Frontend Angular (gestor-fe.assolidaria.org.co y fallback por IP)
server {
    listen 80;
    server_name gestor-fe.assolidaria.org.co 10.3.26.4 localhost;
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Soporte para Angular Router HTML5 History Mode (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché para recursos estáticos
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    client_max_body_size 100M;
}

# 2. Proxy Inverso para Keycloak (auth.assolidaria.org.co)
server {
    listen 80;
    server_name auth.assolidaria.org.co;

    location / {
        proxy_pass http://10.3.26.4:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Soporte WebSockets y conexiones persistentes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
    }

    client_max_body_size 100M;
}

# 3. Proxy Inverso para API Gateway (api-gestor.assolidaria.org.co -> VM2 10.3.26.3:8090)
server {
    listen 80;
    server_name api-gestor.assolidaria.org.co;

    location / {
        proxy_pass http://10.3.26.3:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Soporte WebSockets y conexiones persistentes
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 600s;
        proxy_connect_timeout 60s;
    }

    client_max_body_size 100M;
}
