<div class="dashboard">

  <!-- SIDEBAR -->
  <app-sidebar
    [collapsed]="sidebarCollapsed"
    (hoverChange)="onSidebarHover($event)">
  </app-sidebar>

  <!-- MAIN -->
  <div
    class="dashboard-main"
    [class.dashboard-main-collapsed]="sidebarCollapsed && !sidebarHovered">

    <!-- HEADER -->
    <app-header
      (toggle)="toggleSidebar()">
    </app-header>

    <!-- CONTENT -->
    <main class="dashboard-content">

      <router-outlet></router-outlet>

    </main>

    <!-- FOOTER -->
    <app-footer></app-footer>

  </div>

</div>
