<app-data-table
  [titulo]="titulo"
  [columnas]="columnas"
  [datos]="lista"
  [totalRegistros]="totalRegistros"
  [totalPorPagina]="totalPorPagina"
  [pageSizeOptions]="pageSizeOptions"
  [mostrarDetalle]="true"
  [mostrarGestionarFactura]="true"
  (paginar)="paginar($event)"
  (verDetalle)="verDocumentos($event)"
  (gestionarFactura)="abrirModalGestionar($event)"
  (buscar)="buscar($event)"
  (eliminar)="deletedAt($event)">
</app-data-table>
