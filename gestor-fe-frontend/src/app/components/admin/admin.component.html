<mat-card class="card">
  <mat-card-header>

    <div class="buscador-container">
      <h1>{{ tituloCardHeader }}</h1>
      <mat-form-field appearance="fill" class="buscador-field">
        <mat-label>Buscar</mat-label>

        <input
          matInput
          #input
          placeholder="Buscar..."/>

        <!-- Botón buscar -->
        <button
          mat-icon-button
          matSuffix
          aria-label="Buscar"
          matTooltip="Buscar">
          <mat-icon>search</mat-icon>
        </button>

      </mat-form-field>
      <button
          mat-icon-button
          matSuffix
          aria-label="Buscar"
          matTooltip="Adicionar">
          <mat-icon>add</mat-icon>
        </button>
    </div>

  </mat-card-header>
  <mat-card-content>
    <table
      mat-table
      [dataSource]="dataSource"
      class="full-width-table">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let tipo">{{ tipo.id }}</td>
      </ng-container>
      <ng-container matColumnDef="codigo">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let tipo">{{ tipo.codigo }}</td>
      </ng-container>
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>
          <div>Descripción</div>
        </th>
        <td mat-cell *matCellDef="let tipo">{{ tipo.descripcion }}</td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let tipo">
          <button mat-icon-button color="success">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="danger">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="mostrarColumnas" class="encabezado-tabla"></tr>
      <tr mat-row *matRowDef="let row; columns: mostrarColumnas;"></tr>
    </table>
    <div class="alert alert-info" *ngIf="lista?.length==0"> No hay registros en el sistema</div>
    <mat-paginator
      [length]="totalRegistros"
      [pageSize]="totalPorPagina"
      [pageIndex]="paginaActual"
      [pageSizeOptions]="pageSizeOptions"
      showFirstLastButtons>
    </mat-paginator>
  </mat-card-content>

  <mat-card-actions>

  </mat-card-actions>
</mat-card>
