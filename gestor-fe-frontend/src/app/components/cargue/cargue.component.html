<!-- Input nativo oculto para seleccionar archivo ZIP (exclusivo prestador) -->
<input 
  type="file" 
  #fileInput 
  id="prestadorDirectFileInput"
  style="display: none;" 
  accept=".zip" 
  (change)="onFileSelected($event)">

<app-data-table
  [titulo]="titulo"
  [columnas]="columnas"
  [datos]="lista"
  [totalRegistros]="totalRegistros"
  [totalPorPagina]="totalPorPagina"
  [pageSizeOptions]="pageSizeOptions"
  
  [textoBotonAgregar]="textoBotonAgregar"
  [tooltipAgregar]="tooltipAgregar"
  iconoAgregar="cloud_upload"
  [mostrarCargueInterno]="esAdminOPerfilAdmin"
  textoBotonCargueInterno="Cargue Interno"
  tooltipCargueInterno="Cargar facturas internas con selección de movimiento"
  iconoCargueInterno="cloud_upload"
  
  [mostrarAcciones]="true"
  [mostrarRefrescar]="true"
  [mostrarDetalle]="false"
  [mostrarEditar]="false"
  [mostrarDescargaErrores]="true"
  [mostrarEliminar]="esAdminOPerfilAdmin"
  
  (paginar)="paginar($event)"
  (descargarErrores)="descargarExcelErrores($event)"
  (agregar)="agregar()"
  (cargueInterno)="abrirCargueInterno()"
  (buscar)="buscar($event)"
  (refrescar)="calcularRangos()"
  (eliminar)="deletedAt($event)"
>
</app-data-table>
