<aside
  class="sidebar"
  [class.sidebar-collapsed]="collapsed">

  <!-- LOGO -->
  <div class="sidebar-logo">

    <h2 *ngIf="!collapsed">
      FE
    </h2>

    <h2 *ngIf="collapsed">
      F
    </h2>

  </div>

  <!-- MENU -->
  <ul class="sidebar-menu">

    <li *ngFor="let item of menuNav">

      <!-- ITEM NORMAL CON RUTA -->
      <a
        *ngIf="item.route && !item.children"
        [routerLink]="item.route"
        routerLinkActive="sidebar-active"
        class="sidebar-item">

        <!-- ICONO -->
        <span class="material-icons sidebar-icon">
          {{ item.icon }}
        </span>

        <!-- TEXTO -->
        <span *ngIf="!collapsed" class="sidebar-text">
          {{ item.name }}
        </span>

      </a>

      <!-- ITEM CON SUBMENU -->
      <div
        *ngIf="item.children"
        class="sidebar-item"
        (click)="toggleMenu(item)">

        <!-- ICONO -->
        <span class="material-icons sidebar-icon">
          {{ item.icon }}
        </span>

        <!-- TEXTO -->
        <span *ngIf="!collapsed" class="sidebar-text">
          {{ item.name }}
        </span>

        <!-- FLECHA -->
        <span
          *ngIf="!collapsed"
          class="material-icons sidebar-arrow">

          {{ item.expanded ? 'expand_less' : 'expand_more' }}

        </span>

      </div>

      <!-- SUBMENU -->
      <ul
        *ngIf="item.children && item.expanded && !collapsed"
        class="sidebar-submenu">

        <li *ngFor="let child of item.children">

          <a
            [routerLink]="child.route"
            routerLinkActive="sidebar-active"
            class="sidebar-subitem">

            <!-- ICONO SUBMENU -->
            <span class="material-icons sidebar-subicon">
              {{ child.icon }}
            </span>

            <!-- TEXTO -->
            <span>
              {{ child.name }}
            </span>

          </a>

        </li>

      </ul>

    </li>

  </ul>

</aside>
