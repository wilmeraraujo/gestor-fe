<mat-card class="card">

  <!-- HEADER CON TÍTULO Y BÚSQUEDA A LA IZQUIERDA -->
  <mat-card-header class="card-header-custom">
    <div class="header-content-stacked">

      <!-- 1️⃣ TÍTULO -->
      <h1 class="titulo-tabla">{{ titulo }}</h1>

      <!-- 2️⃣ BUSCADOR Y BOTONES ABAJO A LA IZQUIERDA -->
      <div class="acciones-header-left">

        <mat-form-field appearance="fill" class="buscador-field">
          <mat-label>Buscar</mat-label>
          <input
            matInput
            #txtBuscar
            placeholder="Buscar..."
            (keyup.enter)="onBuscar(txtBuscar.value)"
            (input)="txtBuscar.value === '' ? onBuscar('') : null" />
        </mat-form-field>

        <div class="botones-container">

          <!-- 🔍 BOTÓN BUSCAR GLOBAL -->
          <button
            type="button"
            class="btn-icon-theme btn-search"
            (click)="onBuscar(txtBuscar.value)"
            matTooltip="Buscar en registros">
            <mat-icon>search</mat-icon>
            <span>Buscar</span>
          </button>

          <!-- 🧹 BOTÓN LIMPIAR FILTROS (SIEMPRE VISIBLE) -->
          <button
            type="button"
            class="btn-icon-theme btn-clear-filter"
            (click)="limpiarFiltrosColumnas()"
            matTooltip="Limpiar todos los filtros por columna">
            <mat-icon>filter_alt_off</mat-icon>
            <span>Limpiar</span>
          </button>

          <!-- ➕ BOTÓN ADICIONAR / CARGAR PERSONALIZABLE -->
          <button
            *ngIf="mostrarAgregar"
            type="button"
            class="btn-icon-theme btn-add"
            (click)="agregar.emit()"
            [matTooltip]="tooltipAgregar">
            <mat-icon>add</mat-icon>
            <span>{{ textoBotonAgregar }}</span>
          </button>

        </div>

      </div>

    </div>
  </mat-card-header>

  <!-- CONTENIDO DE LA TABLA -->
  <mat-card-content class="card-content-custom">

    <mat-paginator
      class="paginator-superior"
      [length]="totalRegistros"
      [pageSize]="totalPorPagina"
      [pageSizeOptions]="pageSizeOptions"
      showFirstLastButtons
      (page)="onPaginar($event)">
    </mat-paginator>

    <div class="tabla-responsive">
      <table
        mat-table
        [dataSource]="dataSource"
        class="full-width-table">

        <!-- CHECKBOX SELECCIÓN MÚLTIPLE -->
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef class="cell-checkbox">
            <mat-checkbox
              (change)="$event ? toggleAllRows() : null"
              [checked]="selection.hasValue() && isAllSelected()"
              [indeterminate]="selection.hasValue() && !isAllSelected()">
            </mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let row" class="cell-checkbox">
            <mat-checkbox
              (click)="$event.stopPropagation()"
              (change)="$event ? selection.toggle(row) : null"
              [checked]="selection.isSelected(row)">
            </mat-checkbox>
          </td>
        </ng-container>

        <!-- COLUMNAS DINÁMICAS DE DATOS -->
        <ng-container
          *ngFor="let col of columnas"
          [matColumnDef]="col.field">
          <th mat-header-cell *matHeaderCellDef>
            {{ col.header }}
          </th>
          <td mat-cell *matCellDef="let row" class="text-nowrap">
            
            <!-- 🏷️ BADGES DE ESTADO -->
            <ng-container *ngIf="col.field === 'estado' || col.field === 'estadoNombre'; else celdaTextoNormal">
              <span [class]="obtenerClaseEstado(row[col.field])">
                <mat-icon class="icono-badge-estado" *ngIf="row[col.field] === 'PROCESANDO'">sync</mat-icon>
                <mat-icon class="icono-badge-estado" *ngIf="row[col.field] === 'CARGADO' || row[col.field] === 'CARGUE FINALIZADO'">check</mat-icon>
                <mat-icon class="icono-badge-estado" *ngIf="row[col.field] === 'CON ERRORES' || row[col.field] === 'RECHAZADO'">close</mat-icon>
                <span>{{ row[col.field] }}</span>
              </span>
            </ng-container>

            <ng-template #celdaTextoNormal>
              {{ row[col.field] }}
            </ng-template>

          </td>
        </ng-container>

        <!-- ACCIONES CON SPINNER Y BOTONES -->
        <ng-container matColumnDef="acciones" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="text-center cell-sticky-acciones">
            Acciones
          </th>
          <td mat-cell *matCellDef="let row" class="text-center text-nowrap cell-sticky-acciones">

            <div class="acciones-cell">
              
              <!-- 🔄 SPINNER EN PROCESAMIENTO -->
              <mat-spinner
                *ngIf="row.estadoNombre === 'PROCESANDO' || (!row.jobExecutionId && !row.exiteError)"
                diameter="24"
                matTooltip="Procesando lote en segundo plano...">
              </mat-spinner>

              <!-- ✏️ EDITAR -->
              <button
                *ngIf="mostrarEditar && row.estadoNombre !== 'PROCESANDO'"
                mat-icon-button
                class="btn-action btn-action-edit"
                (click)="onEditar(row)"
                matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>

              <!-- 🧾 GESTIONAR FACTURA -->
              <button
                *ngIf="mostrarGestionarFactura && row.estadoNombre !== 'PROCESANDO'"
                mat-icon-button
                class="btn-action btn-action-invoice"
                (click)="onGestionarFactura(row)"
                matTooltip="Gestionar Factura">
                <mat-icon>receipt_long</mat-icon>
              </button>

              <!-- 📄 DESCARGAR ERRORES -->
              <button
                *ngIf="mostrarDescargaErrores && (row.exiteError === true || row.exiteError === 'true')"
                mat-icon-button
                class="btn-action btn-action-error"
                (click)="onDescargarErrores(row)"
                matTooltip="Descargar Reporte de Errores (Excel)">
                <mat-icon>insert_drive_file</mat-icon>
              </button>

              <!-- 👁️ VER DETALLE -->
              <button
                *ngIf="mostrarDetalle && row.estadoNombre !== 'PROCESANDO'"
                mat-icon-button
                class="btn-action btn-action-view"
                (click)="onVerDetalle(row)"
                matTooltip="Ver registros asociados">
                <mat-icon>visibility</mat-icon>
              </button>

              <!-- 📜 HISTORIAL -->
              <button
                *ngIf="mostrarHistorial"
                mat-icon-button
                class="btn-action btn-action-history"
                style="color: #17889b;"
                (click)="verHistorial.emit(row)"
                matTooltip="Ver Trazabilidad / Historial de Gestiones">
                <mat-icon>history</mat-icon>
              </button>

              <!-- 🗑️ ELIMINAR -->
              <button
                *ngIf="mostrarEliminar"
                mat-icon-button
                class="btn-action btn-action-delete"
                (click)="onEliminar(row)"
                matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>

            </div>

          </td>
        </ng-container>

        <ng-container matColumnDef="select-filter">
          <th mat-header-cell *matHeaderCellDef class="filter-header-cell"></th>
        </ng-container>

        <!-- FILTROS POR COLUMNA (PERMANENTES) -->
        <ng-container *ngFor="let col of columnas" [matColumnDef]="'filter-' + col.field">
          <th mat-header-cell *matHeaderCellDef class="filter-header-cell">
            <mat-form-field
              *ngIf="col.filtrable !== false"
              appearance="outline"
              class="col-filter-input">
              <input
                matInput
                placeholder="Filtrar..."
                [(ngModel)]="filtrosPorColumna[col.field]"
                (keyup)="aplicarFiltrosColumnas()" />
            </mat-form-field>
          </th>
        </ng-container>

        <ng-container matColumnDef="acciones-filter" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="filter-header-cell cell-sticky-acciones"></th>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="encabezado-tabla"></tr>

        <!-- 🎯 LA FILA DE FILTROS AHORA PERMANECE VISIBLE SIEMPRE (display: table-row) -->
        <tr
          mat-header-row
          *matHeaderRowDef="filterColumns"
          class="row-filtros"
          style="display: table-row;">
        </tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>
    </div>

    <div class="alert-info text-center" *ngIf="datos.length === 0">
      No hay registros en el sistema
    </div>

    <mat-paginator
      #paginatorInferior
      [length]="totalRegistros"
      [pageSize]="totalPorPagina"
      [pageSizeOptions]="pageSizeOptions"
      showFirstLastButtons
      (page)="onPaginar($event)">
    </mat-paginator>

  </mat-card-content>
</mat-card>
