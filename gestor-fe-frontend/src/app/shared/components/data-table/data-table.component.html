<mat-card class="card">

  <!-- HEADER -->
  <mat-card-header>
    <div class="buscador-container">
      <h1>{{ titulo }}</h1>
      <div class="acciones-header">

        <!-- BUSCADOR -->
        <mat-form-field appearance="fill" class="buscador-field">
          <mat-label>Buscar</mat-label>
          <input
            matInput
            #txtBuscar
            placeholder="Buscar..."
            (keyup.enter)="onBuscar(txtBuscar.value)"
            (input)="txtBuscar.value === '' ? onBuscar('') : null" />
          <button
            mat-icon-button
            matSuffix
            (click)="onBuscar(txtBuscar.value)">
            <mat-icon>search</mat-icon>
          </button>
        </mat-form-field>

        <!-- BOTON ADD -->
        <button
          *ngIf="mostrarAgregar"
          mat-icon-button
          matTooltip="Adicionar"
          (click)="agregar.emit()">
          <mat-icon>add</mat-icon>
        </button>

      </div>
    </div>
  </mat-card-header>

  <!-- TABLA -->
  <mat-card-content>
    <table
      mat-table
      [dataSource]="dataSource"
      class="full-width-table">

      <!-- 🚀 NUEVA COLUMNA: CHECKBOX SELECCIÓN MÚLTIPLE (Se renderiza al inicio si mostrarSeleccion es true) -->
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox 
            (change)="$event ? toggleAllRows() : null"
            [checked]="selection.hasValue() && isAllSelected()"
            [indeterminate]="selection.hasValue() && !isAllSelected()">
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox 
            (click)="$event.stopPropagation()"
            (change)="$event ? selection.toggle(row) : null"
            [checked]="selection.isSelected(row)">
          </mat-checkbox>
        </td>
      </ng-container>

      <!-- COLUMNAS DINAMICAS -->
      <ng-container
        *ngFor="let col of columnas"
        [matColumnDef]="col.field">
        <th
          mat-header-cell
          *matHeaderCellDef>
          {{ col.header }}
        </th>
        <td
          mat-cell
          *matCellDef="let row">
          {{ row[col.field] }}
        </td>
      </ng-container>

      <!-- ACCIONES -->
      <ng-container matColumnDef="acciones">
        <th
          mat-header-cell
          *matHeaderCellDef>
          Acciones
        </th>
        <td
          mat-cell
          *matCellDef="let row">

          <button
            mat-icon-button
            (click)="onEditar(row)"
            matTooltip="Editar">
            <mat-icon>edit</mat-icon>
          </button>

          <button
            *ngIf="mostrarDescargaErrores && (row.exiteError === true || row.exiteError === 'true')"
            mat-icon-button
            color="warn"
            (click)="onDescargarErrores(row)"
            matTooltip="Descargar Reporte de Errores (Excel)">
            <mat-icon>insert_drive_file</mat-icon>
          </button>

          <button
            *ngIf="mostrarDetalle"
            mat-icon-button
            color="primary"
            (click)="onVerDetalle(row)"
            matTooltip="Ver registros asociados">
            <mat-icon>visibility</mat-icon>
          </button>

          <button
            mat-icon-button
            (click)="onEliminar(row)"
            matTooltip="Eliminar">
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>

      <!-- HEADER -->
      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
        class="encabezado-tabla">
      </tr>

      <!-- ROW -->
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;">
      </tr>

    </table>

    <!-- EMPTY -->
    <div
      class="alert-info"
      *ngIf="datos.length === 0">
      No hay registros en el sistema
    </div>

    <!-- PAGINADOR -->
    <mat-paginator
      [length]="totalRegistros"
      [pageSize]="totalPorPagina"
      [pageSizeOptions]="pageSizeOptions"
      showFirstLastButtons
      (page)="onPaginar($event)">
    </mat-paginator>

  </mat-card-content>
</mat-card>
